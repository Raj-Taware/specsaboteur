domain: database
language: sql
intent: >
  User registration system. Each user has unique email, hashed password,
  created_at timestamp. Email must be case-insensitive unique. Passwords
  must never be stored in plaintext.

spec: |
  Table: users
    - id: INTEGER PRIMARY KEY AUTOINCREMENT
    - email: VARCHAR(255) UNIQUE NOT NULL
    - password: VARCHAR(255) NOT NULL
    - created_at: TIMESTAMP DEFAULT CURRENT_TIMESTAMP

  Insert operation:
    - INSERT INTO users (email, password) VALUES (?, ?)
    - Returns the created user id
    - Fails if email already exists (UNIQUE constraint)

# MEDIUM: adds AUTOINCREMENT, DEFAULT timestamp, insert operation
# Known remaining gap: UNIQUE is case-SENSITIVE in most DBs
# (test@example.com and Test@Example.COM are different values)
# No password hashing requirement — plaintext satisfies VARCHAR NOT NULL

test_cases:
  - name: "case-insensitive unique"
    setup: "user with test@example.com exists"
    input: "INSERT Test@Example.COM"
    expected: "rejected as duplicate"

known_gap: >
  UNIQUE on VARCHAR is case-sensitive. Two accounts with same email
  different case both allowed. Password stored as plaintext satisfies
  VARCHAR NOT NULL constraint. No CHECK constraint or trigger for hashing.
